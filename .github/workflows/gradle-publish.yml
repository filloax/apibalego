#   "chore: release": all targets
#   "chore: release(modrinth)": only x platform (github, curseforge, modrinth)
env:
  CURSEFORGE_ID: "1752909"
  # TODO, for now mc publish just skips it
  MODRINTH_ID: ""

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

jobs:
  build:
    if: "contains(github.event.head_commit.message, 'chore: release') && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.modVersion }}
      version_type: ${{ steps.get_version_type.outputs.versionType }}
      java_version: ${{ steps.java_version.outputs.javaVersion }}
      mc_version: ${{ steps.mc_version.outputs.value }}
      mc_version_range: ${{ steps.mc_version_range.outputs.value }}
      github: ${{ steps.targets.outputs.github }}
      curseforge: ${{ steps.targets.outputs.curseforge }}
      modrinth: ${{ steps.targets.outputs.modrinth }}

    steps:
    - name: Read release targets
      id: targets
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        ALL="github curseforge modrinth"
        TARGETS=$(grep -o -m1 'chore: release([^)]*)' <<< "$COMMIT_MSG" | sed 's/.*(\(.*\))/\1/' | tr ',' ' ' || true)
        TARGETS=${TARGETS:-$ALL}
        for t in $TARGETS; do
          if ! grep -qw "$t" <<< "$ALL"; then
            echo "::error::Unknown release target '$t' (valid: $ALL)"
            exit 1
          fi
        done
        for t in $ALL; do
          if grep -qw "$t" <<< "$TARGETS"; then echo "$t=true" >> $GITHUB_OUTPUT; else echo "$t=false" >> $GITHUB_OUTPUT; fi
        done
        echo "Release targets: $TARGETS"

    - uses: actions/checkout@v4

    - name: "Read Java version"
      uses: BrycensRanch/read-properties-action@v1.0.4
      id: java_version
      with:
        file: gradle.properties
        property: javaVersion

    - name: "Read MC version"
      uses: SebRollen/toml-action@v1.2.0
      id: mc_version
      with:
        file: 'gradle/libs.versions.toml'
        field: 'versions.minecraft'

    - name: "Read MC version range"
      uses: SebRollen/toml-action@v1.2.0
      id: mc_version_range
      with:
        file: 'gradle/libs.versions.toml'
        field: 'versions.minecraft-range'

    - name: "Read mod version"
      uses: BrycensRanch/read-properties-action@v1.0.4
      id: get_version
      with:
        file: gradle.properties
        property: modVersion

    - name: "Read version type"
      id: get_version_type
      run: |
        VERSION_TYPE=$(grep -m1 '^versionType' gradle.properties | cut -d'=' -f2 | xargs)
        echo "versionType=${VERSION_TYPE:-release}" >> $GITHUB_OUTPUT

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.java_version.outputs.javaVersion }}
        distribution: 'temurin'
        settings-path: ${{ github.workspace }}

    - name: Make Gradle Wrapper Executable
      if: ${{ runner.os != 'Windows' }}
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5

    - name: Build with Gradle
      run: ./gradlew build
      env:
        GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

    - name: Extract latest changelog
      run: |
        awk '/^## /{if(found)exit; found=1} found{print}' CHANGELOG.md > latest_changelog.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          base/build/libs/*.jar
          fabric/build/libs/*.jar
          neoforge/build/libs/*.jar
          latest_changelog.txt

  release-github:
    name: Release (GitHub)
    needs: build
    if: needs.build.outputs.github == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts

    - name: Publish (GitHub)
      uses: softprops/action-gh-release@v2
      id: publish_github
      with:
        name: Apibalego ${{ needs.build.outputs.version }} - ${{ needs.build.outputs.mc_version }}
        body_path: latest_changelog.txt
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: true
        tag_name: "${{ needs.build.outputs.version }}-${{ needs.build.outputs.mc_version }}"
        target_commitish: ${{ github.sha }}
        files: |
          base/build/libs/*.jar
          fabric/build/libs/*.jar
          neoforge/build/libs/*.jar

    - name: Trigger Jitpack build
      if: steps.publish_github.outcome == 'success'
      run: |
        sleep 10s && curl --max-time 0 -L \
          https://jitpack.io/com/github/filloax/apibalego/apibalego-base/${{ needs.build.outputs.version }}-${{ needs.build.outputs.mc_version }}/apibalego-base-${{ needs.build.outputs.version }}-${{ needs.build.outputs.mc_version }}.pom

  release-platform:
    name: Publish (${{ matrix.name }})
    needs: build
    if: needs.build.outputs.curseforge == 'true' || needs.build.outputs.modrinth == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: neoforge
            name: Neoforge
            dependencies: |
              filloaxlib(required)
              resourceful-config(required)
              kotlin-for-forge(required)
          - platform: fabric
            name: Fabric
            dependencies: |
              filloaxlib(required)
              resourceful-config(required)
              fabric-language-kotlin(required)
              fabric-api(required)

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts

    - name: Publish
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        curseforge-token: ${{ needs.build.outputs.curseforge == 'true' && env.CURSEFORGE_ID != '' && secrets.TOKEN_CURSEFORGE || '' }}
        curseforge-id: ${{ env.CURSEFORGE_ID }}
        modrinth-token: ${{ needs.build.outputs.modrinth == 'true' && env.MODRINTH_ID != '' && secrets.TOKEN_MODRINTH || '' }}
        modrinth-id: ${{ env.MODRINTH_ID }}
        name: Apibalego ${{ needs.build.outputs.version }} - ${{ needs.build.outputs.mc_version }} ${{ matrix.name }}
        version: "${{ needs.build.outputs.version }}-${{ needs.build.outputs.mc_version }}-${{ matrix.platform }}"
        version-type: ${{ needs.build.outputs.version_type }}
        files: |
          ${{ matrix.platform }}/build/libs/!(*-@(dev|sources|javadoc)).jar
          ${{ matrix.platform }}/build/libs/*-@(dev|sources|javadoc).jar
        game-versions: ${{ needs.build.outputs.mc_version_range }}
        dependencies: ${{ matrix.dependencies }}
        java: ${{ needs.build.outputs.java_version }}
        loaders: ${{ matrix.platform }}
        changelog-file: latest_changelog.txt
