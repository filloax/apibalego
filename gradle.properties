org.gradle.jvmargs = -Xmx4096m
org.gradle.parallel = true

javaVersion = 25

# Mod properties
group               = com.ruslan.apibalego
archives_base_name  = apibalego
modid               = apibalego
modVersion          = 0.1.0

# not required to be filled (alpha, beta, dev)
versionType        = beta

modName            = Apibalego
modIcon            = assets/apibalego/icon.png
author             = Ruslan Fanclub
license            = MIT
displayUrl         = ""

# Settings
includeDeps = false

# Dependencies
useLocalJarFilloaxLib = false
alwaysUseLocalMavenFilloaxLib = true

# Dokka plugin V2 config
org.jetbrains.dokka.experimental.gradle.pluginMode = V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn = true
